<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Portofolio SIM Inventaris, Absensi, Gedung & Stok Retail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single column page; each project = intro grid + a live "app window" demo. Physical objects (asset label, time card, camera) keep print colors in both themes. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f5f8f7; --ink:#13201e; --muted:#566664; --line:#d4dddb;
  --tag:#e9a80f; --tag-ink:#2a1f00; --tag-soft:#fbefcf;
  --teal:#0d7a64; --on-teal:#ffffff; --teal-soft:#d8eee8;
  --bp:#3550a8; --on-bp:#ffffff; --bp-soft:#e1e6f6; --bp-2:#9fb0e2;
  --vio:#6d3fd1; --vio-bg:#eee6fc;
  --ok:#1b7a43; --ok-bg:#dcf1e3; --on-ok:#ffffff;
  --warn:#935500; --warn-bg:#fbebcd;
  --bad:#b1301d; --bad-bg:#f8ded8; --on-bad:#ffffff;
  --info:#1e5ca8; --info-bg:#dde8f6;
  --mute:#5a6765; --mute-bg:#e4e9e8;
  --focus:#1e5ca8;
  --code-bg:#13201e; --code-ink:#d9e4e1;
  --label-bg:#ffffff; --label-ink:#111111; --tag-print:#f2b01e;
  --paper:#f8f6ee; --paper-ink:#2a2a26; --paper-line:#d8d3c3; --stamp:#0d7a64;
  --shadow:0 1px 0 rgba(19,32,30,.04),0 18px 40px -26px rgba(19,32,30,.45);
  --f-display:"Archivo","Noto Sans KR","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans KR",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#151f1e; --surface-2:#1a2625; --ink:#e3eae8; --muted:#95a5a2; --line:#283533;
  --tag:#f3b62c; --tag-ink:#231a00; --tag-soft:#3a2e0e;
  --teal:#3ec2a1; --on-teal:#05201a; --teal-soft:#14332d;
  --bp:#8ea2f0; --on-bp:#0c1636; --bp-soft:#1d2546; --bp-2:#45549a;
  --vio:#b49cf5; --vio-bg:#2a2147;
  --ok:#62cf8d; --ok-bg:#15301f; --on-ok:#06210f;
  --warn:#f0b65a; --warn-bg:#382910;
  --bad:#f08b76; --bad-bg:#3b1c16; --on-bad:#2a0b05;
  --info:#82b2f0; --info-bg:#172a42;
  --mute:#a2afac; --mute-bg:#232f2d;
  --focus:#82b2f0; --code-bg:#09100f; --code-ink:#d9e4e1;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#151f1e; --surface-2:#1a2625; --ink:#e3eae8; --muted:#95a5a2; --line:#283533;
  --tag:#f3b62c; --tag-ink:#231a00; --tag-soft:#3a2e0e;
  --teal:#3ec2a1; --on-teal:#05201a; --teal-soft:#14332d;
  --bp:#8ea2f0; --on-bp:#0c1636; --bp-soft:#1d2546; --bp-2:#45549a;
  --vio:#b49cf5; --vio-bg:#2a2147;
  --ok:#62cf8d; --ok-bg:#15301f; --on-ok:#06210f;
  --warn:#f0b65a; --warn-bg:#382910;
  --bad:#f08b76; --bad-bg:#3b1c16; --on-bad:#2a0b05;
  --info:#82b2f0; --info-bg:#172a42;
  --mute:#a2afac; --mute-bg:#232f2d;
  --focus:#82b2f0; --code-bg:#09100f; --code-ink:#d9e4e1;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)} .small{font-size:12.5px}
button,a,input,select,textarea,tr{outline-offset:2px}
:focus-visible{outline:2px solid var(--focus)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-stretch:112%;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px}
.brand-mark{width:26px;height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 7px,var(--ink) 7px 10px,transparent 10px 12px);border-radius:1px}
.top nav{display:flex;gap:20px}
.top nav a{color:var(--muted);text-decoration:none;font-size:14px}
.top nav a:hover{color:var(--ink)}
@media(max-width:600px){.top nav{display:none}}

/* hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:56px 48px}
@media(max-width:880px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:40px 32px}}
h1{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:clamp(2.1rem,4.7vw,3.75rem);line-height:1.02;letter-spacing:-.012em;margin:.35em 0 .45em;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--tag-soft) 62%)}
h1 em.t{background:linear-gradient(transparent 62%,var(--teal-soft) 62%)}
.lead{font-size:1.08rem;color:var(--muted);max-width:56ch;margin:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-note{margin-top:14px;font-size:13px;color:var(--muted)}
.hero-art{position:relative;min-height:440px}
.hero-art .label-sticker{position:absolute;left:2%;top:18%;width:min(320px,80%);transform:rotate(-4deg);z-index:2}
.timecard{position:absolute;right:0;bottom:4px;width:250px;max-width:70%;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:12px 14px 14px;transform:rotate(5deg);box-shadow:0 20px 40px -24px rgba(0,0,0,.55);font-family:var(--f-mono);font-size:12px;z-index:1}
.tc-h{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.12em;border-bottom:1.5px solid var(--paper-ink);padding-bottom:6px;margin-bottom:4px}
.tc-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;padding:5px 0;border-bottom:1px dashed var(--paper-line);align-items:center}
.tc-row.head{font-size:10px;letter-spacing:.1em;color:#77746a}
.stamp{color:var(--stamp);border:1.5px solid var(--stamp);border-radius:3px;padding:0 4px;transform:rotate(-4deg);display:inline-block;font-weight:500;justify-self:start}
@media(max-width:880px){.hero-art{min-height:420px;max-width:520px}}
@media(max-width:440px){.hero-art{min-height:400px}.hero-art .label-sticker{width:86%;left:0}.timecard{width:210px}}

/* physical label */
.label-sticker{background:var(--label-bg);color:var(--label-ink);border:1px solid #cfcfc6;border-radius:8px;overflow:hidden;box-shadow:0 22px 44px -26px rgba(0,0,0,.6)}
.ls-top{display:flex;justify-content:space-between;gap:8px;background:var(--tag-print);color:#2a1f00;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;padding:6px 12px;font-weight:500}
.ls-name{font-family:var(--f-display);font-weight:700;font-stretch:106%;font-size:15px;padding:10px 12px 6px;line-height:1.2}
.label-sticker .barcode{display:block;width:calc(100% - 24px);height:54px;margin:2px 12px 0}
.ls-code{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-align:center;padding:4px 12px 10px}
.label-sticker.small .barcode{height:44px}

/* buttons */
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:9px 15px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:filter .15s,transform .1s;line-height:1.3}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.tag{background:var(--tag);color:var(--tag-ink)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.ok{background:var(--ok);color:var(--on-ok)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.bad-t{color:var(--bad)!important}

/* project sections */
section.proj{border-top:1px solid var(--line)}
section.proj > .wrap{padding-block:56px}
.proj-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 56px;margin-bottom:28px;align-items:start}
@media(max-width:880px){.proj-head{grid-template-columns:minmax(0,1fr)}}
h2{font-family:var(--f-display);font-stretch:114%;font-weight:760;font-size:clamp(1.65rem,3.1vw,2.45rem);line-height:1.07;margin:.3em 0 .45em;text-wrap:balance}
.proj-head p{margin:0;max-width:60ch}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.feat li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;font-size:14.5px}
.feat li::before{content:"";width:8px;height:8px;margin-top:7px;background:var(--accent);border-radius:1px}
#inventaris{--accent:var(--tag)} #absensi{--accent:var(--teal)} #gedung{--accent:var(--bp)}
.try{margin-top:18px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.try ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}

/* app window */
.app{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#inv-app{--accent:var(--tag);--accent-ink:var(--tag-ink);--accent-soft:var(--tag-soft)}
#abs-app{--accent:var(--teal);--accent-ink:var(--on-teal);--accent-soft:var(--teal-soft)}
.app-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.url{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;flex:0 1 300px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample{font-family:var(--f-mono);font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:2px 7px;letter-spacing:.04em}
.role{margin-left:auto;display:flex;align-items:center;gap:4px}
.role-l{font-size:12px;color:var(--muted);margin-right:4px}
.role button{font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.role button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(max-width:640px){.url{display:none}.role{margin-left:0;width:100%}}
.app-body{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:580px}
.app-nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav-brand{padding:4px 10px 14px;font-family:var(--f-display);font-weight:700;font-stretch:110%;font-size:15.5px;display:grid;gap:2px}
.nav-brand small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);font-stretch:100%}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav-btn .lock{margin-left:auto;font-size:10px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-user{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.3}
.nav-user small{display:block;color:var(--muted);font-size:11.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
@media(max-width:760px){
  .app-body{grid-template-columns:minmax(0,1fr)}
  .app-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .nav-brand,.nav-user{display:none}
  .nav-btn{width:auto;white-space:nowrap;flex:none}
}
.app-main{padding:20px 22px;min-width:0}
@media(max-width:480px){.app-main{padding:14px}}

/* views */
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h3{font-family:var(--f-display);font-stretch:108%;font-size:1.3rem;margin:0;line-height:1.2}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:960px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.k-l{font-size:12.5px;color:var(--muted)}
.k-v{font-family:var(--f-display);font-size:1.85rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi.warn .k-v{color:var(--warn)} .kpi.info .k-v{color:var(--info)} .kpi.ok .k-v{color:var(--ok)} .kpi.bad .k-v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
@media(max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.panel h4{margin:0 0 12px;font-size:13.5px;font-weight:600}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 2.6rem;gap:10px;align-items:center;font-size:13px}
.hb-t{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.hb-f{display:block;height:100%;background:var(--accent)}
.hb-v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
@media(max-width:480px){.hbar{grid-template-columns:7rem minmax(0,1fr) 2.3rem}}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:14px}
.seg.ok,.dot.ok{background:var(--ok)} .seg.warn,.dot.warn{background:var(--warn)} .seg.bad,.dot.bad{background:var(--bad)} .seg.info,.dot.info{background:var(--info)} .seg.mute,.dot.mute{background:var(--mute)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.legend.inline{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.bad{color:var(--bad);background:var(--bad-bg)} .chip.info{color:var(--info);background:var(--info-bg)} .chip.mute{color:var(--mute);background:var(--mute-bg)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border-top:0}
.log-t{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.log.compact li{grid-template-columns:minmax(0,1fr);gap:1px}
@media(max-width:520px){.log li{grid-template-columns:minmax(0,1fr);gap:1px}}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input{flex:1 1 240px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.fchip:hover{color:var(--ink)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-row]{cursor:pointer}
.tbl tbody tr[data-row]:hover{background:var(--surface-2)}
.tbl tr.me td{background:var(--teal-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.num,.tbl td.mono{white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:28px!important}

/* drawer */
.drawer-scrim{position:absolute;inset:0;background:rgba(8,18,16,.38);z-index:5}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:6;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:-24px 0 40px -28px rgba(0,0,0,.5)}
.drawer-h{display:flex;justify-content:space-between;align-items:center}
.icon-btn{font:inherit;font-size:20px;line-height:1;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kv{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:8px 12px;margin:0;font-size:14px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.drawer h5{margin:2px 0 -6px;font-size:13px}
.danger{border-top:1px solid var(--line);padding-top:12px;margin-top:auto;font-size:13.5px}
.danger p{margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* scan */
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:960px){.scan-grid{grid-template-columns:minmax(0,1fr)}}

.vf-card div{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-align:center;color:#111;margin-top:4px}
.vf-frame{--c:#f2b01e;position:absolute;inset:14% 12%;background:
  linear-gradient(var(--c),var(--c)) top left/24px 3px no-repeat,linear-gradient(var(--c),var(--c)) top left/3px 24px no-repeat,
  linear-gradient(var(--c),var(--c)) top right/24px 3px no-repeat,linear-gradient(var(--c),var(--c)) top right/3px 24px no-repeat,
  linear-gradient(var(--c),var(--c)) bottom left/24px 3px no-repeat,linear-gradient(var(--c),var(--c)) bottom left/3px 24px no-repeat,
  linear-gradient(var(--c),var(--c)) bottom right/24px 3px no-repeat,linear-gradient(var(--c),var(--c)) bottom right/3px 24px no-repeat}
.scanline{position:absolute;left:12%;right:12%;height:2px;background:#ff5a45;box-shadow:0 0 14px 3px rgba(255,90,69,.55);top:50%}
.viewfinder.busy .scanline{animation:scan .9s ease-in-out infinite alternate}
@keyframes scan{from{top:18%}to{top:82%}}

.vf-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#c9d3d1;font-size:11.5px;font-family:var(--f-mono);letter-spacing:.06em}
.scan-side{display:grid;gap:14px}
.form{display:grid;gap:10px}

.found{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}

/* requests */
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2)}

.seg-ctl button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.req-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:16px;align-items:start}

.req-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.req{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex-wrap:wrap}

.note{font-size:13px;background:var(--info-bg);color:var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 14px}

/* absensi */
.abs-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:960px){.abs-grid{grid-template-columns:minmax(0,1fr)}}
.clock-card{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px}
.clock{font-family:var(--f-display);font-stretch:122%;font-weight:700;font-size:clamp(2.5rem,6vw,3.5rem);line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:14px;margin-top:6px}
.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tl-row{display:grid;grid-template-columns:4.5rem auto 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.tl-row .mono{font-size:15px;font-variant-numeric:tabular-nums}
.tl-row .chip{justify-self:end}
.today-log{display:grid;gap:8px}
.radar{width:100%;max-width:230px;aspect-ratio:1;display:block;margin:0 auto 8px}
.radar text{font-family:var(--f-mono);font-size:10px}
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;margin:10px 0}

.cal-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.day{aspect-ratio:1.15;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:13px;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;text-align:left;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.day i{font-style:normal;font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.hadir{background:var(--ok-bg);border-color:transparent}.day.hadir i{color:var(--ok)}
.day.terlambat{background:var(--warn-bg);border-color:transparent}.day.terlambat i{color:var(--warn)}
.day.izin,.day.sakit{background:var(--info-bg);border-color:transparent}.day.izin i,.day.sakit i{color:var(--info)}
.day.alpa{background:var(--bad-bg);border-color:transparent}.day.alpa i{color:var(--bad)}
.day.libur{background:transparent;border-style:dashed;color:var(--muted);cursor:default}
.day.future{background:transparent;color:var(--muted);cursor:default}

.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
@media(max-width:480px){.day{aspect-ratio:1;padding:4px}.day i{display:none}.cal{gap:4px}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.meter{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter span{display:block;height:100%;background:var(--teal)}
.daydetail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:13.5px}

/* tech */

function baseMonth(){
  if(monthCache) return monthCache;
  const y=TODAY.getFullYear(),m=TODAY.getMonth(),n=new Date(y,m+1,0).getDate(),rnd=mulberry32(y*100+m+7),out=[];
  for(let d=1;d<=n;d++){

    if(wd===0||wd===6) st='libur';

    out.push({d,wd,st,inT,outT});
  }
  return monthCache=out;
}

  if(d.role){if(bld.role!==d.role){bld.role=d.role;if(bld.role==='admin'&&bld.lform.usaha===ME_T)bld.lform.usaha='';if(bld.role==='tenan')bld.lform.usaha=ME_T;renderBld();toast(t('toast.signedIn',{name:bld.role==='admin'?t('role.bldAdmin'):`${ME_T} (${t('role.tenant')})`}))}return}
  if(d.floor){bld.floor=d.floor;bld.sel=null;renderBld();return}
  if(d.room){selRoom(d.room);return}
  if(d.tf){bld.tf=d.tf;renderBld();return}
  if(d.pick){bld.lform.unit=d.pick;renderBld();toast(t('bld.toast.pick',{u:d.pick}));return}
  const a=d.act;
  if(a==='bd-unsel'){bld.sel=null;$('#bd-plan').innerHTML=planHTML();$('#bd-side').innerHTML=sideHTML()}
  else if(a==='bd-lease'){bld.lform.unit=bld.sel;bld.tab='sewa';renderBld();const el=$('#ls-usaha');el&&el.focus()}
  else if(a==='bd-report'){bld.tform.room=bld.sel;bld.tab='tiket';renderBld();const el=$('#tk-title');el&&el.focus()}
  else if(a==='ap-ok'||a==='ap-no'){
    const ap=bld.apps.find(x=>x.id===d.id);
    if(a==='ap-ok'){const c=checkLease({unit:ap.unit,start:ap.start<TISO?TISO:ap.start,dur:String(ap.dur),usaha:ap.usaha},ap.id);
      if(!c.ok&&!bld.contracts.some(k=>k.unit===ap.unit&&k.tenant===ap.usaha&&iso(addDays(Dt(k.end),1))===ap.start)){toast(t('bld.toast.cant',{why:c.msg}),'bad');return}
      ap.st='disetujui';const m=applyApp(ap);renderBld();toast(m);return}
    ap.st='ditolak';renderBld();toast(`${ap.id} · ${t('rq.ditolak')}`);
  }
  else if(a==='extend'){const c=bld.contracts.find(x=>x.id===d.id);c.end=endOf(iso(addDays(Dt(c.end),1)),12);renderBld();toast(t('bld.toast.renewed',{id:c.id,d:fmtD(c.end)}))}
  else if(a==='renew'){
    const c=bld.contracts.find(x=>x.tenant===ME_T&&x.st==='aktif'&&x.start<=TISO&&x.end>=TISO);const start=iso(addDays(Dt(c.end),1));
    bld.apps.unshift({id:'PS-0'+(bld.seq++),unit:c.unit,usaha:ME_T,jenis:c.jenis,start,dur:12,end:endOf(start,12),by:ME_T,st:'menunggu'});
    renderBld();toast(t('bld.toast.renewSent'));
  }
  else if(a==='inv-paid'){const i=bld.invoices.find(x=>x.id===d.id);i.st='lunas';renderBld();toast(t('bld.toast.paid',{id:i.id}))}
  else if(a==='inv-pay'){const i=bld.invoices.find(x=>x.id===d.id);i.st='verifikasi';renderBld();toast(t('bld.toast.confirm'))}
  else if(a==='tk-go'){const k=bld.tickets.find(x=>x.id===d.id);k.st='dikerjakan';k.tech=k.prio==='tinggi'?'Joko Susilo':'Asep Hidayat';renderBld();toast(t('bld.toast.assigned',{id:k.id,tech:k.tech}))}
  else if(a==='tk-done'){const k=bld.tickets.find(x=>x.id===d.id);k.st='selesai';renderBld();toast(k.close?t('bld.toast.doneOpen',{id:k.id,u:k.room}):t('bld.toast.done',{id:k.id}))}
});
bldApp.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-room]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selRoom(g.dataset.room)}});
const LSF={'ls-unit':'unit','ls-usaha':'usaha','ls-jenis':'jenis','ls-start':'start','ls-dur':'dur'},TKF={'tk-room':'room','tk-title':'title','tk-prio':'prio'};
function bldField(e){
  const id=e.target.id;
  if(LSF[id]){bld.lform[LSF[id]]=e.target.value;$('#ls-check').innerHTML=leaseCheckHTML();return}
  if(TKF[id]){bld.tform[TKF[id]]=e.target.value;return}
  if(id==='tk-close') bld.tform.close=e.target.checked;
}
bldApp.addEventListener('input',bldField);bldApp.addEventListener('change',bldField);
bldApp.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='ls-form'){
    const f=bld.lform,c=checkLease(f);if(!c.ok){toast(c.msg,'bad');return}
    const isA=bld.role==='admin';
    const ap={id:'PS-0'+(bld.seq++),unit:f.unit,usaha:f.usaha.trim(),jenis:f.jenis,start:f.start,dur:+f.dur,end:c.end,by:isA?ADMIN_T:ME_T,st:isA?'disetujui':'menunggu'};
    bld.apps.unshift(ap);
    if(isA){const m=applyApp(ap);renderBld();toast(m)}else{renderBld();toast(t('bld.toast.leaseSent'))}
  }
  if(e.target.id==='tk-form'){
    const f=bld.tform;if(!f.title.trim()){toast(t('bld.toast.needIssue'),'bad');return}
    bld.tickets.unshift({id:'TKT-0'+(bld.seq++),room:f.room,title:f.title.trim(),prio:f.prio,st:'baru',by:gMe(),date:TISO,tech:null,close:f.close});
    bld.tform={room:f.room,title:'',prio:'sedang',close:false};renderBld();
    toast(f.close?t('bld.toast.reportClosed',{u:f.room}):t('bld.toast.report'));
  }
});

'hero.h1':[`Empat aplikasi untuk urusan harian: <em>barang</em>, <em class="t">kehadiran</em>, <em class="b">gedung</em>, dan <em class="r">stok toko</em>.`,`Four apps for everyday operations: <em>assets</em>, <em class="t">attendance</em>, <em class="b">buildings</em>, and <em class="r">store stock</em>.`,`Empat aplikasi untuk urusan harian: <em>aset</em>, <em class="t">kehadiran</em>, <em class="b">bangunan</em> dan <em class="r">stok kedai</em>.`,`일상 업무를 위한 네 가지 앱: <em>자산</em>, <em class="t">근태</em>, <em class="b">건물</em>, 그리고 <em class="r">매장 재고</em>.`],
'hero.lead':[`SIM Inventaris mencatat setiap aset sampai ke label barcode-nya. Sistem Absensi mencatat jam masuk dan keluar karyawan, lengkap dengan cuti, lembur, dan absen lewat QR. SIM Gedung mengelola unit yang disewakan ke tenan, dari kontrak sampai tagihan bulanan. SIM Stok Retail menghubungkan kasir dan gudang toko, sehingga setiap penjualan langsung mengurangi stok. Keempatnya bisa dicoba langsung di halaman ini.`,`The Inventory System tracks every asset down to its barcode label. The Attendance System records when employees clock in and out, along with leave, overtime and QR check-in. The Building System manages units leased to tenants, from contracts to monthly invoices. The Retail Stock System connects a shop's till and stockroom, so every sale comes straight off the stock count. You can try all four right on this page.`,`Sistem Inventori merekod setiap aset hingga ke label kod barnya. Sistem Kehadiran merekod waktu masuk dan keluar pekerja, lengkap dengan cuti, kerja lebih masa dan kehadiran melalui QR. Sistem Bangunan mengurus unit yang disewakan kepada penyewa, daripada kontrak hingga bil bulanan. Sistem Stok Runcit menghubungkan kaunter juruwang dan stor kedai, jadi setiap jualan terus mengurangkan stok. Keempat-empatnya boleh dicuba terus di halaman ini.`,`재고 관리 시스템은 모든 자산을 바코드 라벨 단위까지 기록합니다. 근태 관리 시스템은 직원의 출퇴근 시간과 휴가, 초과근무, QR 출결을 기록합니다. 건물 관리 시스템은 계약부터 월별 청구서까지 테넌트에게 임대한 호실을 관리합니다. 매장 재고 시스템은 계산대와 창고를 연결해 모든 판매가 곧바로 재고에서 차감되게 합니다. 네 가지 모두 이 페이지에서 바로 체험할 수 있습니다.`],

'abs.name':[`Sistem Absensi`,`Attendance System`,`Sistem Kehadiran`,`근태 관리 시스템`],
'abs.eyebrow':[`Sistem Absensi · Manajemen Kehadiran`,`Attendance System · Attendance management`,`Sistem Kehadiran · Pengurusan kehadiran`,`근태 관리 시스템 · 출결 관리`],
'abs.h2':[`Absen masuk dan keluar dengan satu tombol atau pindai QR.`,`Clock in and out with one button or a QR scan.`,`Daftar masuk dan keluar dengan satu butang atau imbasan QR.`,`버튼 하나 또는 QR 스캔으로 출퇴근을 기록합니다.`],
'abs.p':[`Karyawan mencatat kehadiran dari dashboard atau dengan memindai kode QR di kantor. Cuti, lembur, dan koreksi absensi diajukan dari aplikasi yang sama, lalu diputuskan admin. Rekap bulanan bisa diekspor ke Excel.`,`Employees record attendance from the dashboard or by scanning a QR code at the office. Leave, overtime and attendance corrections are requested in the same app and decided by an admin. Monthly summaries can be exported to Excel.`,`Pekerja merekod kehadiran dari papan pemuka atau dengan mengimbas kod QR di pejabat. Cuti, kerja lebih masa dan pembetulan kehadiran dimohon dalam aplikasi yang sama, kemudian diputuskan oleh admin. Rekod bulanan boleh dieksport ke Excel.`,`직원은 대시보드에서 또는 사무실의 QR 코드를 스캔해 출결을 기록합니다. 휴가, 초과근무, 근태 정정은 같은 앱에서 신청하고 관리자가 결정합니다. 월별 집계는 Excel로 내보낼 수 있습니다.`],
'abs.f1':[`Dashboard dengan jam berjalan, status absen hari ini, serta tombol Absen Masuk dan Absen Keluar.`,`A dashboard with a live clock, today's attendance status, and Clock In and Clock Out buttons.`,`Papan pemuka dengan jam masa nyata, status kehadiran hari ini, serta butang Daftar Masuk dan Daftar Keluar.`,`실시간 시계, 오늘의 출결 상태, 출근·퇴근 버튼이 있는 대시보드.`],
'abs.f2':[`Ringkasan bulan berjalan: hadir, terlambat, sisa cuti, dan pengajuan yang masih menunggu.`,`This month at a glance: days present, late arrivals, leave left and pending requests.`,`Ringkasan bulan semasa: hadir, lewat, baki cuti dan permohonan yang masih menunggu.`,`이번 달 요약: 출근일, 지각, 남은 휴가, 대기 중인 신청.`],
'abs.f3':[`Pengajuan cuti, lembur, dan koreksi absensi dengan persetujuan admin.`,`Leave, overtime and attendance correction requests with admin approval.`,`Permohonan cuti, kerja lebih masa dan pembetulan kehadiran dengan kelulusan admin.`,`관리자 승인을 거치는 휴가, 초과근무, 근태 정정 신청.`],
'abs.f4':[`Absensi dengan kode QR yang ditampilkan di kantor.`,`Check-in with a QR code displayed at the office.`,`Kehadiran melalui kod QR yang dipaparkan di pejabat.`,`사무실에 표시된 QR 코드로 출결 기록.`],
'abs.f5':[`Export rekap kehadiran ke Excel.`,`Export attendance summaries to Excel.`,`Eksport rekod kehadiran ke Excel.`,`출결 집계를 Excel로 내보내기.`],
'abs.t1':[`Pilih jam 08:23, lalu tekan Absen Masuk.`,`Pick 08:23, then press Clock In.`,`Pilih jam 08:23, kemudian tekan Daftar Masuk.`,`08:23을 선택한 뒤 출근을 눌러 보세요.`],
'abs.t2':[`Ajukan koreksi untuk hari yang tercatat alpa, setujui sebagai Admin, lalu lihat kalender di menu Absensi.`,`Request a correction for a day marked absent, approve it as Admin, then check the calendar under Attendance.`,`Mohon pembetulan untuk hari yang direkod tidak hadir, luluskan sebagai Admin, kemudian lihat kalendar di menu Kehadiran.`,`결근으로 기록된 날의 정정을 신청하고 관리자로 승인한 뒤, 출결 메뉴의 달력을 확인해 보세요.`],
'abs.t3':[`Buka QR Absensi sebagai Admin, lalu pindai sebagai Karyawan.`,`Open QR Check-in as Admin, then scan it as an Employee.`,`Buka QR Kehadiran sebagai Admin, kemudian imbas sebagai Pekerja.`,`관리자로 QR 출결을 연 뒤 직원으로 스캔해 보세요.`],

'bld.name':[`SIM Gedung`,`Building System`,`Sistem Bangunan`,`건물 관리 시스템`],
'bld.eyebrow':[`SIM Manajemen Gedung · Sewa Tenan`,`Building Management · Tenant leasing`,`Sistem Pengurusan Bangunan · Sewaan penyewa`,`건물 관리 시스템 · 테넌트 임대`],
'bld.h2':[`Unit sewa, kontrak tenan, dan tagihan dalam satu denah.`,`Leasable units, tenant contracts and invoices on one floor plan.`,`Unit sewa, kontrak penyewa dan bil dalam satu pelan lantai.`,`임대 호실, 테넌트 계약, 청구서를 하나의 평면도에서.`],
'bld.p':[`Aplikasi untuk pengelola gedung yang menyewakan unit ke tenan. Denah lantai menunjukkan unit yang kosong, sedang disewa, atau kontraknya hampir habis. Pengajuan sewa dicek otomatis terhadap kontrak yang masih berjalan, lalu tagihan bulanan dan laporan kerusakan dari tenan dipantau sampai selesai.`,`An app for building managers who lease units to tenants. The floor plan shows which units are vacant, leased or nearing the end of their contract. Lease applications are checked automatically against running contracts, and monthly invoices and tenant damage reports are tracked until resolved.`,`Aplikasi untuk pengurus bangunan yang menyewakan unit kepada penyewa. Pelan lantai menunjukkan unit yang kosong, sedang disewa atau kontraknya hampir tamat. Permohonan sewa disemak secara automatik terhadap kontrak yang masih berjalan, manakala bil bulanan dan laporan kerosakan daripada penyewa dipantau hingga selesai.`,`테넌트에게 호실을 임대하는 건물 관리자를 위한 앱입니다. 평면도에서 공실, 임대 중, 계약 만료 임박 호실을 한눈에 볼 수 있습니다. 임대 신청은 진행 중인 계약과 자동으로 대조되며, 월별 청구서와 테넌트의 고장 신고는 처리 완료까지 추적됩니다.`],
'bld.f1':[`Denah unit per lantai dengan status: tersedia, disewa, kontrak segera berakhir, sudah dipesan, atau dalam perbaikan.`,`Per-floor unit plan with statuses: available, leased, contract ending soon, reserved or under repair.`,`Pelan unit setiap tingkat dengan status: tersedia, disewa, kontrak hampir tamat, sudah ditempah atau dalam pembaikan.`,`층별 호실 평면도와 상태 표시: 임대 가능, 임대 중, 계약 만료 임박, 예약됨, 수리 중.`],
'bld.f2':[`Pengajuan sewa dengan cek bentrok kontrak, hitungan biaya sewa dan deposit, serta saran unit lain yang kosong.`,`Lease applications with contract-overlap checks, rent and deposit calculations, and suggestions for other vacant units.`,`Permohonan sewa dengan semakan pertindihan kontrak, kiraan sewa dan deposit, serta cadangan unit kosong lain.`,`계약 중복 확인, 임대료·보증금 계산, 다른 공실 추천이 포함된 임대 신청.`],
'bld.f3':[`Daftar kontrak dan tagihan bulanan, termasuk perpanjangan kontrak dan konfirmasi pembayaran.`,`Contract list and monthly invoices, including renewals and payment confirmation.`,`Senarai kontrak dan bil bulanan, termasuk pembaharuan kontrak dan pengesahan bayaran.`,`계약 갱신과 납부 확인을 포함한 계약 목록 및 월별 청구서.`],
'bld.f4':[`Tiket perawatan dari tenan sampai selesai dikerjakan teknisi.`,`Maintenance tickets from the tenant's report to the technician's fix.`,`Tiket penyelenggaraan daripada laporan penyewa hingga siap dibaiki juruteknik.`,`테넌트 신고부터 기술자 처리 완료까지의 유지보수 티켓.`],
'bld.f5':[`Pemantauan listrik dan air gedung.`,`Building electricity and water monitoring.`,`Pemantauan elektrik dan air bangunan.`,`건물 전기·수도 사용량 모니터링.`],
'bld.t1':[`Klik unit hijau di denah, lalu ajukan sewa sebagai Tenan.`,`Click a green unit on the plan, then apply to lease it as a Tenant.`,`Klik unit hijau pada pelan, kemudian mohon sewa sebagai Penyewa.`,`평면도에서 초록색 호실을 클릭하고 테넌트로 임대를 신청해 보세요.`],
'bld.t2':[`Ajukan sewa U-101 mulai bulan depan dan lihat peringatan bentrok kontrak.`,`Apply for U-101 starting next month and see the contract-overlap warning.`,`Mohon sewa U-101 bermula bulan depan dan lihat amaran pertindihan kontrak.`,`다음 달부터 U-101 임대를 신청하고 계약 중복 경고를 확인해 보세요.`],
'bld.t3':[`Sebagai Tenan, ajukan perpanjangan kontrak; setujui sebagai Admin Gedung.`,`As a Tenant, request a contract renewal; approve it as Building Admin.`,`Sebagai Penyewa, mohon pembaharuan kontrak; luluskan sebagai Admin Bangunan.`,`테넌트로 계약 갱신을 신청하고 건물 관리자로 승인해 보세요.`],

function stockCard(sku){
  const p=rprod(sku),ev=[],g={};
  rt.tx.forEach(x=>x.items.forEach(i=>{if(i.sku!==sku)return;const k=iso(x.t),e=g[k]||(g[k]={t:x.t,qty:0,n:0,type:'jual'});e.qty-=i.qty;e.n++;if(x.t>e.t)e.t=x.t}));
  Object.values(g).forEach(e=>ev.push(e));
  rt.moves.filter(m=>m.sku===sku).forEach(m=>ev.push({...m}));
  ev.sort((a,b)=>b.t-a.t);

  return ev;
}

function barSvg(labels,series,o){
  const W=o.w||600,H=212,Lf=52,Rr=8,T=12,B=labels.some(l=>l.b)?36:24,pw=W-Lf-Rr,ph=H-T-B;
  const mx=Math.max(1,...series.flatMap(s=>s.v)),st=niceStep(mx/4),ym=st*4,bw=pw/labels.length,gw=bw*.7,sw=gw/series.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}"${o.fit?' style="min-width:0"':''}>`;
  for(let i=0;i<=4;i++){const v=st*i,y=T+ph-v/ym*ph;s+=`<line class="g" x1="${Lf}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text class="t" x="${Lf-6}" y="${y+3.5}" text-anchor="end">${v?cmp(v):'0'}</text>`}
  labels.forEach((lb,i)=>{const x0=Lf+i*bw+(bw-gw)/2,cx=(x0+gw/2).toFixed(1);let g='';
    series.forEach((se,k)=>{const h=se.v[i]/ym*ph;if(h>0)g+=`<rect class="${se.cls}" x="${(x0+k*sw+.5).toFixed(1)}" y="${(T+ph-h).toFixed(1)}" width="${Math.max(1,sw-1).toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`});
    s+=`<g><title>${esc(o.tips[i])}</title><rect x="${x0.toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ph}" fill="transparent"/>${g}</g><text class="t" x="${cx}" y="${T+ph+15}" text-anchor="middle">${lb.a}</text>${lb.b?`<text class="t" x="${cx}" y="${T+ph+28}" text-anchor="middle" style="font-size:9px">${lb.b}</text>`:''}`});
  return s+'</svg>';
}

    <h5>${t('rt.d.card')}</h5><ul class="log compact">${card.map(e=>`<li><span class="log-t">${e.type==='jual'?fmtD(iso(e.t)):fmtDT(e.t)}</span><span>${esc(mvL(e))} · <b class="${e.qty<0?'bad-t':'ok-t'}">${sgn(e.qty)}</b> · ${t('rt.d.bal',{n:e.bal})}</span></li>`).join('')}</ul>`);

const RT_VIEWS={dash:vRtDash,pos:vPos,produk:vProduk,masuk:vMasuk,opname:vOpname,laporan:vLaporan};
function renderRt(){rtNav();$('#rt-main').innerHTML=RT_VIEWS[rt.tab]();$('#rt-drawer').innerHTML=rtDrawer();drawAll($('#rt-app'))}
function heroReceipt(){
  const el=$('#hero-rcpt');if(!el)return;let tot=0;
  el.innerHTML=`<div class="rc-h">${RT_STORE.toUpperCase()}</div>`+[['RT-1008',3],['RT-1001',2],['RT-1005',1]].map(([s,q])=>{const p=rprod(s);tot+=q*p.price;return `<div class="rc-l"><span>${esc(L(p.name))}</span></div><div class="rc-l"><span>${q} × ${nf(p.price)}</span><span>${nf(q*p.price)}</span></div>`}).join('')+
    `<div class="rc-t"><span>${t('art.total')}</span><span>${nf(tot)}</span></div><div class="rc-f">${t('art.thanks')}</div>`;
}
const rtApp=$('#rt-app');
const focusClose=()=>setTimeout(()=>{const c=$('#rt-drawer .icon-btn');c&&c.focus()},0);
function addCart(sku){const p=rprod(sku),c=rt.cart.find(x=>x.sku===sku);if((c?c.qty:0)+1>p.stock){toast(t('rt.toast.max',{name:L(p.name),n:p.stock}),'bad');return false}if(c)c.qty++;else rt.cart.push({sku,qty:1});return true}
function checkout(){
  if(!canPay())return;
  for(const c of rt.cart){const p=rprod(c.sku);if(c.qty>p.stock){toast(t('rt.toast.max',{name:L(p.name),n:p.stock}),'bad');return}}
  const tot=cartTotal(),paid=rt.pay==='qris'?tot:+rt.cash;
  const x={id:'TRX-'+(18000+rt.seq.trx++),t:new Date(),kasir:rme(),method:rt.pay,items:rt.cart.map(c=>{const p=rprod(c.sku);return {sku:c.sku,qty:c.qty,price:p.price,cost:p.cost}}),total:tot,paid,change:paid-tot};
  x.items.forEach(i=>{rprod(i.sku).stock-=i.qty});rt.tx.push(x);
  const low=x.items.map(i=>rprod(i.sku)).find(p=>p.stock<=p.min);
  rt.cart=[];rt.cash='';rt.receipt=x.id;renderRt();focusClose();
  toast(low?t('rt.toast.low',{id:x.id,name:L(low.name),n:low.stock}):t('rt.toast.paid',{id:x.id,r:rp(tot)}));
}
function postOp(o){o.lines.forEach(l=>{const p=rprod(l.sku),d=Math.max(-p.stock,l.phys-l.sys);if(!d)return;p.stock+=d;rt.moves.push({sku:l.sku,t:new Date(),type:'opname',qty:d,ref:o.id})});o.st='disetujui'}
rtApp.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-role],[data-pc],[data-pf],[data-oc],[data-add],[data-inc],[data-dec],[data-pay],[data-cash],[data-sku],[data-rc],[data-act]');if(!b||!rtApp.contains(b))return;
  const d=b.dataset;
  if(d.tab){rt.tab=d.tab;rt.sel=null;rt.receipt=null;renderRt();return}
  if(d.role){if(rt.role!==d.role){rt.role=d.role;rt.draft={};renderRt();toast(t('toast.signedIn',{name:`${rme()} (${t(isRA()?'role.storeAdmin':'role.cashier')})`}))}return}
  if(d.pc){rt.pc=d.pc;renderRt();return}
  if(d.pf){rt.pf=d.pf;renderRt();return}
  if(d.oc){rt.oc=d.oc;rt.draft={};renderRt();return}
  if(d.add||d.inc){if(addCart(d.add||d.inc))renderRt();return}
  if(d.dec){const c=rt.cart.find(x=>x.sku===d.dec);if(c){c.qty--;if(c.qty<=0)rt.cart=rt.cart.filter(x=>x!==c)}renderRt();return}
  if(d.pay){rt.pay=d.pay;renderRt();return}
  if(d.cash){rt.cash=d.cash;renderRt();return}
  if(d.rc){rt.receipt=d.rc;renderRt();focusClose();return}
  if(d.sku){rt.sel=d.sku;renderRt();focusClose();return}
  const a=d.act;
  if(a==='close'){const prev=rt.sel;rt.sel=null;rt.receipt=null;renderRt();if(prev){const r=$(`#rt-main [data-sku="${prev}"]`);r&&r.focus()}}
  else if(a==='clear'){rt.cart=[];rt.cash='';renderRt()}
  else if(a==='scan'){const av=rt.products.filter(p=>p.stock-inCart(p.sku)>0);if(!av.length){toast(t('rt.toast.noScan'),'bad');return}const p=av[Math.floor(Math.random()*av.length)];addCart(p.sku);renderRt();toast(t('rt.toast.scan',{name:L(p.name)}))}
  else if(a==='checkout') checkout();
  else if(a==='po-make'){
    const sel=reorder().filter(p=>!rt.unpick.has(p.sku)),g={};sel.forEach(p=>(g[p.sup]=g[p.sup]||[]).push(p));
    Object.entries(g).forEach(([sup,ps])=>rt.pos.push({id:'PO-'+String(rt.seq.po++).padStart(4,'0'),sup,date:new Date(),st:'dipesan',items:ps.map(p=>({sku:p.sku,qty:p.max-p.stock,buy:p.cost}))}));
    renderRt();toast(t('rt.toast.po',{n:Object.keys(g).length}));
  }
  else if(a==='po-recv'){
    const o=rt.pos.find(x=>x.id===d.id),ch=[];
    o.items.forEach(i=>{const p=rprod(i.sku),old=p.cost;p.cost=p.stock+i.qty>0?Math.round((p.stock*p.cost+i.qty*i.buy)/(p.stock+i.qty)/10)*10:i.buy;if(p.cost!==old)ch.push([p,old]);p.stock+=i.qty;rt.moves.push({sku:i.sku,t:new Date(),type:'masuk',qty:i.qty,ref:o.id})});
    o.st='diterima';o.recv=new Date();renderRt();
    toast(t('rt.toast.recv',{id:o.id})+(ch.length?' · '+ch.map(([p,old])=>t('rt.toast.cost',{name:L(p.name),a:rp(old),b:rp(p.cost)})).join(' · '):''));
  }
  else if(a==='op-ok'||a==='op-no'){const o=rt.ops.find(x=>x.id===d.id);if(a==='op-ok')postOp(o);else o.st='ditolak';renderRt();toast(a==='op-ok'?t('rt.toast.opPosted',{id:o.id}):`${o.id} · ${t('rq.ditolak')}`)}
});
rtApp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-sku]')){rt.sel=e.target.dataset.sku;renderRt();focusClose()}
  if(e.key==='Escape'&&(rt.sel||rt.receipt)){rt.sel=null;rt.receipt=null;renderRt()}
});
rtApp.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='rt-q'||id==='rt-pq'){rt[id==='rt-q'?'q':'pq']=e.target.value;renderRt();const el=$('#'+id);el.focus();el.setSelectionRange(el.value.length,el.value.length);return}
  if(id==='rt-cash'){rt.cash=e.target.value;updPay();return}
  const s=e.target.dataset.op;
  if(s){const p=rprod(s),v=e.target.value===''?null:Math.max(0,Math.floor(+e.target.value));if(v==null)delete rt.draft[s];else rt.draft[s]=v;
    const dd=(rt.draft[s]??p.stock)-p.stock;$('#od-'+s).innerHTML=opDiff(dd);const vv=$('#ov-'+s);if(vv)vv.textContent=dd?rpS(dd*p.cost):'—';$('#op-tot').innerHTML=opTotHTML()}
});
rtApp.addEventListener('change',e=>{const s=e.target.dataset.pick;if(s){if(e.target.checked)rt.unpick.delete(s);else rt.unpick.add(s);renderRt()}});
rtApp.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='rt-price-form'){const p=rprod(rt.sel),v=Math.round(+$('#rt-price').value);if(!v||v<p.cost){toast(t('rt.toast.priceBad'),'bad');return}p.price=v;renderRt();toast(t('rt.toast.price',{name:L(p.name),r:rp(v)}))}
  if(e.target.id==='rt-op-form'){
    const o={id:'OP-'+String(rt.seq.op++).padStart(4,'0'),by:rme(),t:new Date(),cat:rt.oc,st:'menunggu',lines:rt.products.filter(p=>p.cat===rt.oc).map(p=>({sku:p.sku,sys:p.stock,phys:rt.draft[p.sku]??p.stock}))};
    rt.ops.unshift(o);rt.draft={};
    if(isRA()){postOp(o);renderRt();toast(t('rt.toast.opPosted',{id:o.id}))}else{renderRt();toast(t('rt.toast.opSent',{id:o.id}))}
  }
});

/* ===== teks statis & pilihan bahasa ===== */
function applyStatic(){
  document.documentElement.lang=LANGS[LI];
  document.title=t('doc.title');
  $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $$('[data-i18n-html]').forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml)});
  $$('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  $$('[data-list]').forEach(el=>{const k=el.dataset.list,n=+el.dataset.n;let h='';for(let i=1;i<=n;i++)h+=`<li>${t(k+i)}</li>`;el.innerHTML=h});
  $$('[data-wd]').forEach(el=>{el.textContent=new Date(2024,0,+el.dataset.wd).toLocaleDateString(loc(),{weekday:'long'})});
  $$('.lang button').forEach(b=>{const on=b.dataset.lang===LANGS[LI];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}
function renderAll(){applyStatic();renderInv();renderAbs();renderBld();renderRt();heroReceipt()}
$$('.lang button').forEach(b=>b.addEventListener('click',()=>{const l=b.dataset.lang;if(LANGS[LI]===l)return;LI=LANGS.indexOf(l);try{localStorage.setItem('pf-lang',l)}catch(e){}renderAll();toast(t('toast.lang'))}));
renderAll();drawAll(document);
window.addEventListener('load',()=>{$$('svg.barcode').forEach(s=>{delete s.dataset.drawn});drawAll(document)});
})();
